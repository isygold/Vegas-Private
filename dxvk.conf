#=============================================================================
#  VEGAS / DXVK-Sarek  –  Per-Game Configuration
#=============================================================================
#  Place this file in the same directory as the game executable, or set
#  DXVK_CONFIG_FILE=/path/to/dxvk.conf
#
#  Syntax:
#    key = value              — applies to every game
#    [game.exe]               — section applies only to "game.exe"
#    [game.exe][other.exe]    — applies to multiple executables
#    [.*]                     — applies to all (use sparingly)
#
#  Options prefixed with dxvk.vegas.* are VEGAS-specific.  All others
#  are standard DXVK options inherited from Sarek / upstream DXVK.
#
#  Value types:
#    bool        True / False
#    int32       any integer (0 = auto for dxvk.vegas.threshold)
#    Tristate    Auto / True / False
#=============================================================================


#=============================================================================
#  [GLOBAL DEFAULTS]
#  These apply to every game unless overridden in a per-game section.
#=============================================================================

# --- VEGAS master control ------------------------------------------------
# dxvk.vegas.enable       = True      # Master on/off
# dxvk.vegas.threshold    = 0         # Draw-call flush threshold (0=auto)
# dxvk.vegas.vramSwap     = True      # Clamp reported VRAM to ~40 % of RAM
# dxvk.vegas.gpuMask      = Auto      # Spoof NVIDIA GPU persona
# dxvk.vegas.tbdr         = Auto      # TBDR-aware optimisations

# --- Quality-of-life defaults for mobile ----------------------------------
# dxgi.deferSurfaceCreation = True
# dxgi.enableDummyCompositionSwapchain = True
# d3d9.presentInterval      = 1
# dxvk.maxFrameLatency      = 1
# d3d9.maxFrameRate         = 60


#=============================================================================
#  [UNITY ENGINE GAMES]
#  Many Unity titles ship with NVAPI-conditional rendering paths that
#  degrade quality on non-NVIDIA GPUs.  Enabling GPU persona masking
#  (dxvk.vegas.gpuMask) spoofs a mid-range NVIDIA card so Unity picks
#  the higher-quality path without crashing.
#=============================================================================

[Hollow Knight.exe]
dxvk.vegas.enable       = True
dxvk.vegas.threshold    = 0           # auto: ~200 for Adreno 600+
dxvk.vegas.vramSwap     = True
dxvk.vegas.gpuMask      = Auto
dxvk.vegas.tbdr         = Auto
d3d9.presentInterval    = 1
dxvk.maxFrameLatency    = 1
dxgi.maxFrameRate       = 60

[Subnautica.exe]
dxvk.vegas.enable       = True
dxvk.vegas.threshold    = 200
dxvk.vegas.vramSwap     = True
dxvk.vegas.gpuMask      = False       # Subnautica's terrain rendering works
                                       # better with the real GPU exposed
d3d9.presentInterval    = 1
dxvk.maxFrameLatency    = 2

[Celeste.exe]
dxvk.vegas.enable       = True
dxvk.vegas.threshold    = 100         # Low-poly 2D; flush early is fine
d3d9.presentInterval    = 1
dxvk.maxFrameLatency    = 1


#=============================================================================
#  [SOURCE ENGINE GAMES]
#  Source (Left 4 Dead 2, Portal 2, Half-Life 2, Counter-Strike: Source)
#  has very small draw-call batches already.  Raising the VEGAS threshold
#  too high can hurt responsiveness.  Keep threshold low / 0 (auto).
#
#  Overheating fix:  Force vramSwap on and cap frame-rate to 60.
#=============================================================================

[left4dead2.exe]
dxvk.vegas.enable       = True
dxvk.vegas.threshold    = 0           # auto ~100-150 for Source
dxvk.vegas.vramSwap     = True        # Helps reduce VRAM-induced thermal load
dxvk.vegas.gpuMask      = Auto
dxvk.vegas.tbdr         = Auto
d3d9.maxFrameRate       = 60
d3d9.presentInterval    = 1
dxvk.maxFrameLatency    = 1

[hl2.exe]
dxvk.vegas.enable       = True
dxvk.vegas.threshold    = 0
d3d9.maxFrameRate       = 60
d3d9.presentInterval    = 1

[portal2.exe]
dxvk.vegas.enable       = True
dxvk.vegas.threshold    = 0
d3d9.maxFrameRate       = 60
d3d9.presentInterval    = 1

[cstrike.exe]
dxvk.vegas.enable       = True
dxvk.vegas.threshold    = 0
d3d9.maxFrameRate       = 60
d3d9.presentInterval    = 1


#=============================================================================
#  [CRYSIS / CRYENGINE GAMES]
#  CryEngine notoriously allocates massive texture pools and triggers
#  out-of-memory errors on GPUs with "only" 4 GB VRAM.  VRAM swap is
#  essential.  GPU persona mask helps CryEngine select the right shader
#  permutation.
#=============================================================================

[Crysis.exe]
dxvk.vegas.enable       = True
dxvk.vegas.threshold    = 0
dxvk.vegas.vramSwap     = True
dxvk.vegas.gpuMask      = Auto
dxvk.vegas.tbdr         = Auto
d3d9.maxFrameRate       = 60
d3d9.presentInterval    = 1
dxvk.maxFrameLatency    = 2

[Crysis Warhead.exe]
dxvk.vegas.enable       = True
dxvk.vegas.threshold    = 0
dxvk.vegas.vramSwap     = True
dxvk.vegas.gpuMask      = Auto
d3d9.maxFrameRate       = 60


#=============================================================================
#  [GRAND THEFT AUTO V / RAGE ENGINE]
#  GTA V is very sensitive to reported VRAM size — it uses it for
#  texture-quality decisions.  VRAM swap should report 2-3 GB for safe
#  high-quality.  GPU persona mask to NVIDIA avoids degraded shaders.
#=============================================================================

[GTA5.exe]
dxvk.vegas.enable       = True
dxvk.vegas.threshold    = 0
dxvk.vegas.vramSwap     = True
dxvk.vegas.gpuMask      = Auto
d3d9.maxFrameRate       = 60
d3d9.presentInterval    = 1
dxvk.maxFrameLatency    = 1


#=============================================================================
#  [THE ELDER SCROLLS / FALLOUT (CREATION ENGINE)]
#  Bethesda's Gamebryo-derived engine is draw-call-heavy in outdoor areas.
#  A moderately higher threshold (150-250) helps batch terrain draws.
#  VRAM cap prevents the engine from allocating gigantic texture pools.
#=============================================================================

[Skyrim.exe]
dxvk.vegas.enable       = True
dxvk.vegas.threshold    = 150
dxvk.vegas.vramSwap     = True
d3d9.maxFrameRate       = 60
d3d9.presentInterval    = 1

[Oblivion.exe]
dxvk.vegas.enable       = True
dxvk.vegas.threshold    = 150
d3d9.maxFrameRate       = 60
d3d9.presentInterval    = 1

[FalloutNV.exe]
dxvk.vegas.enable       = True
dxvk.vegas.threshold    = 150
d3d9.maxFrameRate       = 60
d3d9.presentInterval    = 1

[Fallout3.exe]
dxvk.vegas.enable       = True
dxvk.vegas.threshold    = 150
d3d9.maxFrameRate       = 60
d3d9.presentInterval    = 1


#=============================================================================
#  [NEED FOR SPEED / RACING GAMES]
#  Racing titles often use high-frequency draw-call bursts for trackside
#  detail.  A slightly higher threshold smooths frame-pacing.
#=============================================================================

[NFS Most Wanted.exe]
dxvk.vegas.enable       = True
dxvk.vegas.threshold    = 200
d3d9.maxFrameRate       = 60
d3d9.presentInterval    = 1

[NFS Carbon.exe]
dxvk.vegas.enable       = True
dxvk.vegas.threshold    = 200
d3d9.maxFrameRate       = 60
d3d9.presentInterval    = 1


#=============================================================================
#  [DISABLE VEGAS (FALLBACK)]
#  If a game has rendering issues with VEGAS, create a per-game section
#  with enable = False.  The game will fall back to vanilla Sarek/Base DXVK
#  behaviour.
#=============================================================================

# [BrokenGame.exe]
# dxvk.vegas.enable = False


