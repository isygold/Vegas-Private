# ============================================================================
# VEGAS — DXVK Configuration for Adreno Android Emulation
# ============================================================================
# Star Emulator / Winlator — Optimized for Qualcomm Adreno GPUs
#
# Place this file in:
#   /storage/emulated/0/Winlator/          (Winlator)
#   /storage/emulated/0/Download/          (alternative)
#   /storage/emulated/0/                   (fallback)
#
# Or set the environment variable:
#   DXVK_CONFIG_FILE=/path/to/dxvk.conf
# ============================================================================

# ============================================================================
# ★★★  MASTER SWITCH  ★★★
# ============================================================================
# Controls ALL Vegas Adreno optimization features as a group.
#
#   Auto  → Enable on Adreno GPUs, disable on all others   (default ★)
#   True  → Force-enable all features (for testing)
#   False → Force-disable all features (emergency escape hatch)
#
# dxvk.enableStarProfile = Auto


# ============================================================================
# ★  FRAMETIME GRAPH PERFORMANCE COLORS  (DXVK_HUD=frametimes)
# ============================================================================
# The upstream DXVK frametime graph now reflects Vegas performance state
# in real time. Enable with DXVK_HUD=frametimes.
#
# Graph line colors:
#   Green  (NORMAL)       — frame time < 1.5× target
#   Yellow (LAGGING)      — frame time ≥ 1.5× target
#   Orange (STUTTERING)   — frame-to-frame delta > 1.25× target
#   Red    (OVERHEATING)  — GPU load ≥ 95% AND ft ≥ 3× target
#
# The current state label appears at top-left of the graph.
# No separate Vegas HUD configuration needed.


# ============================================================================
# ★  FSR 1.0 SPATIAL UPSCALER
# ============================================================================
# FSR 1.0 EASU compute upscaler. Renders at lower resolution and upscales
# to swapchain output. Best on Tier 2-3 Adreno GPUs.
# Set game to 720p (or 540p) internal resolution for best results.
#
#   Auto  → Upscale when render < swapchain resolution   (default ★)
#   True  → Always upscale (render in half-resolution quadrants)
#   False → Disable FSR upscaling entirely
#
# vegas.enableUpscaler = Auto


# ============================================================================
# ★  GPU TIER OVERRIDE  (Advanced)
# ============================================================================
# Override the auto-detected Adreno performance tier.
# Useful if your GPU is misclassified by the KGSL device-name parser.
#
#   0  → Auto-detect based on GPU model              (default ★)
#   1  → Force low-end   (GTX 1050 Ti persona)
#   2  → Force mid-range (GTX 1070 persona)
#   3  → Force high-end  (RTX 3060 persona)
#
# vegas.forceTier = 0


# ============================================================================
# ★  COMPILER THREADS  (Advanced)
# ============================================================================
# Number of shader compiler threads.
# On ARM64, auto-detect caps at 4 to prevent CPU contention on big.LITTLE.
#
#   0  → Auto (max 4 on ARM64, all cores on desktop)   (default ★)
#   N  → Use exactly N compiler threads
#
# dxvk.numCompilerThreads = 0


# ============================================================================
# ★  V-SYNC / SYNC INTERVAL
# ============================================================================
# Override synchronization interval for presentation.
#
#   -1  → Application default (no override)            (default ★)
#    0  → Disable V-Sync (may cause tearing)
#    1  → Enable V-Sync (60 FPS cap)
#
# dxgi.syncInterval = -1


# ============================================================================
# ★  FRAME RATE LIMITER
# ============================================================================
# Limits the frame rate. Helpful for games with physics tied to frame rate,
# or to reduce heat on sustained workloads.
#
#    0  → Default (no limit)                           (default ★)
#   N   → Limit to N frames per second
#  -N   → Soft limit: engage only when running >N FPS
#   -1  → Always disable limiter
#
# dxgi.maxFrameRate = 0


# ============================================================================
# ★  ADAPTIVE PROPORTIONAL GOVERNOR  (with drawsPerMs throughput sensor)
# ============================================================================
# VEGAS uses an adaptive proportional governor with a CPU throughput sensor.
#
# Core formula (each frame):
#   threshold = drawsThisFrame / targetFlushesPerFrame
#
# This instantly adapts to any scenario:
#   15 draws/frame × 2 target flushes → threshold = 7
#   100 draws/frame × 2 target flushes → threshold = 50
#   6800 draws/frame × 2 target flushes → threshold = 150 (hardware-capped)
#
# The target (2-8 flushes/frame) is tuned by the drawsPerMs throughput sensor:
#   drawsPerMs = drawsThisFrame / frameTime_ms
#
#   drawsPerMs < 20 & GPU < 40%  → CPU/Wine bottleneck detected:
#     Force minimum flushes (2) to reduce translation-layer overhead.
#   GPU > 80% & frame time stable → GPU-bound:
#     Decrement target (batch more, fewer flushes).
#   Frame time spike → increment target (flush more, reduce tile overflow).
#
# Hardware architectural guard: per-tier min/max clamp keeps the threshold
# within the Adreno tile buffer safe range.
#
# Scene-change guard prevents combat spikes from destabilizing the target.
#
# No per-game presets or manual tuning needed. VEGAS_THRESHOLDS and
# dxvk.vegas.threshold are now ignored (deprecated — kept for compat).


# ============================================================================
# ============================================================================
# ★  GAME-SPECIFIC PRESETS  (Per-Game Config)
# ============================================================================
# VEGAS auto-detects the running game executable and applies a preset.
# NOTE: Draw thresholds are now handled by the adaptive proportional governor
# (see above). The presets here still control HAAE (early submission)
# thresholds, which benefit from per-game tuning.
#
#   General (non-Unity)  → HAAE thresholds {30, 50, 100}
#   Unity Engine games   → HAAE thresholds {50, 80, 150}
#
# To manually override the preset:
#   VEGAS_GAME_CONFIG=Unity     Use Unity preset on any game
#   VEGAS_GAME_CONFIG=General   Force the general preset
#
# For advanced tuning only — manual threshold env vars (comma-separated
# for tiers 1,2,3):
#   VEGAS_THRESHOLDS=100,200,350   (General default — DEPRECATED, ignored)
#   VEGAS_THRESHOLDS=200,400,700   (Unity preset — DEPRECATED, ignored)
#   VEGAS_THRESHOLDS=150,300,500   (custom — DEPRECATED, ignored)


# ============================================================================
# ★  HUD (DXVK Built-in)
# ============================================================================
# Built-in DXVK HUD elements. Comma-separated list.
# Note: DXVK_HUD=frametimes shows Vegas performance state colors.
#
# Common values:
#   devinfo,fps        → GPU info + frame rate
#   frametimes,gpuload → Frame time graph + GPU load
#   full               → All HUD elements
#
# dxvk.hud =


# ============================================================================
# ★  LOG LEVEL
# ============================================================================
# Controls DXVK log verbosity.
#
#   none   → Suppress all logging
#   error  → Errors only
#   warn   → Warnings + errors                         (default ★)
#   info   → Informational + warnings + errors
#   debug  → Verbose (includes Vegas per-frame metrics)
#
# DXVK_LOG_LEVEL=warn


# ============================================================================
# ★  LATENCY CONTROL
# ============================================================================
# Built-in latency reduction. May reduce input lag in GPU-bound games.
# Can cause frame pacing issues in some titles.
#
#   Auto  → Enable when NV_low_latency2 is available   (default ★)
#   True  → Force-enable latency sleep
#   False → Disable entirely
#
# dxvk.latencySleep = Auto


# ============================================================================
# ★  DEVICE FILTER
# ============================================================================
# Only exposes Vulkan devices whose name contains this string.
# Use if multiple GPUs are present.
#
# DXVK_FILTER_DEVICE_NAME="Adreno"


# ============================================================================
# ★  VRAM LIMITS  (Advanced)
# ============================================================================
# Override reported VRAM. VEGAS auto-tunes to 40% of system RAM.
# Only set these if you need to force a specific value.
#
# dxgi.maxDeviceMemory = 2048
# dxgi.maxSharedMemory  = 1024


# ============================================================================
# ★  PERFORMANCE TWEAKS  (Advanced — use with caution)
# ============================================================================

# Anisotropic filtering override. 0=disable, 1-16=force, -1=application default.
# d3d11.samplerAnisotropy = -1
# d3d9.samplerAnisotropy  = -1

# Tear-free control. True=mailbox (no tearing), False=relaxed fifo.
# dxvk.tearFree = Auto

# Async pipeline compilation (GPLAsync). ON by default — compiles shaders
# in a background thread so the game never stalls waiting for a pipeline.
# May cause brief visual glitches on the first frame of a new shader.
# Disable with dxvk.enableAsync = False if you prefer correct rendering
# over smoothness.
#
# dxvk.enableAsync = True

# GPL state cache. OFF by default — uses GPL fast-linking instead.
# Enabling may reduce stutter further at the cost of slightly more
# GPU memory and longer loading times for the initial cache build.
#
# dxvk.gplAsyncCache = False
