name: Build DXVK (x64 + x32)

on:
  workflow_dispatch:

permissions:
  contents: write
  deployments: write

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set_version.outputs.version }}
      tag: ${{ steps.set_version.outputs.tag }}
    steps:
      - name: Compute version
        id: set_version
        run: |
          SANITIZED_REF="${GITHUB_REF_NAME//\//-}"
          echo "version=${SANITIZED_REF}-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "tag=v2.4.1-vegas-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

  build-mingw-x64:
    name: MinGW x64
    runs-on: ubuntu-latest
    needs: [setup]
    container:
      image: fedora:44
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          dnf install -y \
            git \
            mingw64-gcc mingw64-gcc-c++ mingw64-binutils mingw64-crt \
            mingw64-winpthreads mingw64-vulkan-headers mingw64-spirv-headers \
            gh glslang meson ninja-build pkgconf

      - name: Build x64
        run: |
          chmod +x package-release.sh
          ./package-release.sh \
            "${{ needs.setup.outputs.version }}" \
            build \
            --no-package --64-only --build-id

      - name: Upload to Release (x64)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.setup.outputs.tag }}"
          gh release create --repo isygold/Vegas-Private "$TAG" --draft --title "$TAG" --notes "" 2>/dev/null || true
          find build/ -name "*.dll" -o -name "*.dll.a" | while read f; do
            gh release upload --repo isygold/Vegas-Private "$TAG" "$f#x64/$(basename $f)" --clobber
          done

  build-mingw-x32:
    name: MinGW x32
    runs-on: ubuntu-latest
    needs: [setup]
    container:
      image: fedora:44
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          dnf install -y \
            git \
            mingw32-gcc mingw32-gcc-c++ mingw32-binutils mingw32-crt \
            mingw32-winpthreads mingw32-vulkan-headers mingw32-spirv-headers \
            gh glslang meson ninja-build pkgconf

      - name: Build x32
        run: |
          chmod +x package-release.sh
          ./package-release.sh \
            "${{ needs.setup.outputs.version }}" \
            build \
            --no-package --32-only --build-id

      - name: Upload to Release (x32)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.setup.outputs.tag }}"
          gh release create --repo isygold/Vegas-Private "$TAG" --draft --title "$TAG" --notes "" 2>/dev/null || true
          find build/ -name "*.dll" -o -name "*.dll.a" | while read f; do
            gh release upload --repo isygold/Vegas-Private "$TAG" "$f#x32/$(basename $f)" --clobber
          done

  package-wcp:
    name: Package WCP
    runs-on: ubuntu-latest
    needs: [setup, build-mingw-x64, build-mingw-x32]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install zstd
        run: sudo apt-get update -y && sudo apt-get install -y zstd

      - name: Download from Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.setup.outputs.tag }}"
          mkdir -p workdir
          cd workdir
          gh release download --repo isygold/Vegas-Private "$TAG"

      - name: Restructure for WCP
        run: |
          cd workdir
          mkdir -p system32 syswow64
          find . -name "*.dll" | while read f; do
            case "$f" in
              */x64/*) cp "$f" system32/ ;;
              */x32/*) cp "$f" syswow64/ ;;
              *) cp "$f" system32/ ;;
            esac
          done

      - name: Read version
        id: version
        run: |
          VERSION=$(cat RELEASE 2>/dev/null || echo "2.4.1")
          echo "release=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package WCP (DXVK type)
        run: |
          set -e
          cd workdir
          VERSION="${{ steps.version.outputs.release }}"
          TAG="${{ needs.setup.outputs.tag }}"
          export VERSION TAG
          python3 -c "import json,os; v=os.environ['VERSION']; json.dump({'type':'DXVK','versionName':f'{v}-vegas','versionCode':1,'description':'VEGAS - Community DXVK fork optimized for Android/Winlator','files':[{'source':'system32/d3d8.dll','target':r'\${system32}/d3d8.dll'},{'source':'system32/d3d9.dll','target':r'\${system32}/d3d9.dll'},{'source':'system32/d3d10core.dll','target':r'\${system32}/d3d10core.dll'},{'source':'system32/d3d11.dll','target':r'\${system32}/d3d11.dll'},{'source':'system32/dxgi.dll','target':r'\${system32}/dxgi.dll'},{'source':'syswow64/d3d8.dll','target':r'\${syswow64}/d3d8.dll'},{'source':'syswow64/d3d9.dll','target':r'\${syswow64}/d3d9.dll'},{'source':'syswow64/d3d10core.dll','target':r'\${syswow64}/d3d10core.dll'},{'source':'syswow64/d3d11.dll','target':r'\${syswow64}/d3d11.dll'},{'source':'syswow64/dxgi.dll','target':r'\${syswow64}/dxgi.dll'}]},open('profile.json','w'),indent=2)"
          tar --zstd -cf "../dxvk-${VERSION}-${TAG}.wcp" system32/ syswow64/ profile.json

      - name: Package WCP (VEGAS type)
        run: |
          set -e
          cd workdir
          VERSION="${{ steps.version.outputs.release }}"
          TAG="${{ needs.setup.outputs.tag }}"
          export VERSION TAG
          python3 -c "import json,os; v=os.environ['VERSION']; json.dump({'type':'VEGAS','versionName':f'vegas-{v}','versionCode':1,'description':'VEGAS - community DXVK fork optimized for Adreno GPUs','files':[{'source':'system32/d3d8.dll','target':r'\${system32}/d3d8.dll'},{'source':'system32/d3d9.dll','target':r'\${system32}/d3d9.dll'},{'source':'system32/d3d10core.dll','target':r'\${system32}/d3d10core.dll'},{'source':'system32/d3d11.dll','target':r'\${system32}/d3d11.dll'},{'source':'system32/dxgi.dll','target':r'\${system32}/dxgi.dll'},{'source':'syswow64/d3d8.dll','target':r'\${syswow64}/d3d8.dll'},{'source':'syswow64/d3d9.dll','target':r'\${syswow64}/d3d9.dll'},{'source':'syswow64/d3d10core.dll','target':r'\${syswow64}/d3d10core.dll'},{'source':'syswow64/d3d11.dll','target':r'\${syswow64}/d3d11.dll'},{'source':'syswow64/dxgi.dll','target':r'\${syswow64}/dxgi.dll'}]},open('profile.json','w'),indent=2)"
          tar --zstd -cf "../vegas-${VERSION}-${TAG}.wcp" system32/ syswow64/ profile.json

      - name: Upload WCP to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.setup.outputs.tag }}"
          gh release upload --repo isygold/Vegas-Private "$TAG" ./*.wcp --clobber
          gh release edit --repo isygold/Vegas-Private "$TAG" --draft=false

      - name: Upload vegas config
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.setup.outputs.tag }}"
          if [ -d vegas ]; then
            tar czf vegas-config.tar.gz vegas/
            gh release upload "$TAG" vegas-config.tar.gz --clobber
          fi
