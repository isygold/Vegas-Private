name: Build VEGAS Port for DXVK-Sarek

on:
  workflow_dispatch:

env:
  NINJAJOBS: 2

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: fedora:40
      options: --cpus 2
    strategy:
      matrix:
        arch: [x86_64, i686]
    steps:
      # Install git first so checkout uses proper git clone
      - name: Install git (needed for checkout)
        run: dnf install -y git

      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install build dependencies
        run: |
          dnf install -y \
            meson ninja-build \
            mingw64-gcc-c++ mingw64-winpthreads-static \
            mingw32-gcc-c++ mingw32-winpthreads-static \
            glslang p7zip

      - name: Setup meson
        run: |
          case "${{ matrix.arch }}" in
            x86_64) cross=build-win64.txt ;;
            i686)   cross=build-win32.txt ;;
          esac
          meson setup build \
            --cross-file "$cross" \
            --buildtype release

      - name: Compile
        run: |
          ninja -C build -j${NINJAJOBS}

      - name: Package DLLs
        run: |
          mkdir -p artifacts
          case "${{ matrix.arch }}" in
            x86_64) bit=64 ;;
            i686)   bit=32 ;;
          esac
          cp build/src/d3d11/d3d11.dll  artifacts/d3d11-${bit}.dll || true
          cp build/src/dxgi/dxgi.dll    artifacts/dxgi-${bit}.dll   || true
          cp build/src/dxvk/dxvk.dll    artifacts/dxvk-${bit}.dll   || true
          cp build/src/d3d10/d3d10.dll  artifacts/d3d10-${bit}.dll || true
          7za a "vegas-sarek-${bit}.7z" ./artifacts/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vegas-sarek-${{ matrix.arch }}
          path: vegas-sarek-*.7z
