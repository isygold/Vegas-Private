name: Build VEGAS Port for DXVK-Sarek

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container: fedora:40
    strategy:
      matrix:
        arch: [x86_64, i686]
    steps:
      # Install git first so checkout can use it
      - name: Install git (needed for checkout)
        run: dnf install -y git

      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install build dependencies
        run: |
          dnf install -y \
            meson ninja-build \
            mingw64-gcc-c++ mingw64-winpthreads-static \
            mingw32-gcc-c++ mingw32-winpthreads-static \
            glslang p7zip

      - name: Setup meson
        run: |
          case "${{ matrix.arch }}" in
            x86_64) cross=build-win64.txt ;;
            i686)   cross=build-win32.txt ;;
          esac
          meson setup build \
            --cross-file "$cross" \
            --buildtype release

      - name: Compile
        run: |
          ninja -C build -j$(nproc)

      - name: Package DLLs
        run: |
          mkdir -p artifacts
          case "${{ matrix.arch }}" in
            x86_64) bit=64 ;;
            i686)   bit=32 ;;
          esac
          cp build/src/d3d11/libd3d11.so  artifacts/d3d11-${bit}.so || true
          cp build/src/dxgi/libdxgi.so    artifacts/dxgi-${bit}.so   || true
          cp build/src/dxvk/libdxvk.so    artifacts/libdxvk-${bit}.so || true
          cp build/src/d3d10/libd3d10.so  artifacts/d3d10-${bit}.so || true
          7z a "vegas-sarek-${bit}.7z" ./artifacts/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vegas-sarek-${{ matrix.arch }}
          path: vegas-sarek-*.7z

  create-release:
    needs: [build]
    runs-on: ubuntu-22.04
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/1.11.1'
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "sarek-port-$(date +%Y%m%d%H%M)"
          name: "VEGAS Port for DXVK-Sarek (dev build)"
          body: |
            Automated build of VEGAS optimizations ported to DXVK-Sarek.
            Draw threshold governor, dynamic VRAM swap, GPU persona mask.
          files: |
            vegas-sarek-*/vegas-sarek-*.7z
          draft: false
          prerelease: true
