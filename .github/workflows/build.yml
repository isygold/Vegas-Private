name: Build DXVK (x64 + x32)

on:
  workflow_dispatch:

permissions:
  contents: write
  deployments: write

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set_version.outputs.version }}
      tag: ${{ steps.set_version.outputs.tag }}
    steps:
      - name: Compute version
        id: set_version
        run: |
          SANITIZED_REF="${GITHUB_REF_NAME//\//-}"
          echo "version=${SANITIZED_REF}-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "tag=v2.4.1-vegas-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

  build-mingw-x64:
    name: MinGW x64
    runs-on: ubuntu-latest
    needs: [setup]
    container:
      image: fedora:44
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          dnf install -y \
            git \
            mingw64-gcc mingw64-gcc-c++ mingw64-binutils mingw64-crt \
            mingw64-winpthreads mingw64-vulkan-headers mingw64-spirv-headers \
            glslang meson ninja-build pkgconf

      - name: Build x64
        run: |
          chmod +x package-release.sh
          ./package-release.sh \
            "${{ needs.setup.outputs.version }}" \
            build \
            --no-package --64-only --build-id

      - name: Upload to Release (x64)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.setup.outputs.tag }}"
          # Create draft release (idempotent — fails silently if exists)
          gh release create "$TAG" --draft --title "$TAG" --notes "" 2>/dev/null || true
          # Upload all DLLs
          find build/ -name "*.dll" -o -name "*.dll.a" | while read f; do
            gh release upload "$TAG" "$f" --clobber
          done

  build-mingw-x32:
    name: MinGW x32
    runs-on: ubuntu-latest
    needs: [setup]
    container:
      image: fedora:44
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          dnf install -y \
            git \
            mingw32-gcc mingw32-gcc-c++ mingw32-binutils mingw32-crt \
            mingw32-winpthreads mingw32-vulkan-headers mingw32-spirv-headers \
            glslang meson ninja-build pkgconf

      - name: Build x32
        run: |
          chmod +x package-release.sh
          ./package-release.sh \
            "${{ needs.setup.outputs.version }}" \
            build \
            --no-package --32-only --build-id

      - name: Upload to Release (x32)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.setup.outputs.tag }}"
          gh release create "$TAG" --draft --title "$TAG" --notes "" 2>/dev/null || true
          find build/ -name "*.dll" -o -name "*.dll.a" | while read f; do
            gh release upload "$TAG" "$f" --clobber
          done

  package-wcp:
    name: Package WCP
    runs-on: ubuntu-latest
    needs: [build-mingw-x64, build-mingw-x32]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install zstd
        run: sudo apt-get update -y && sudo apt-get install -y zstd

      - name: Download from Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.setup.outputs.tag }}"
          mkdir -p workdir
          cd workdir
          gh release download "$TAG"

      - name: Restructure for WCP
        run: |
          cd workdir
          mkdir -p system32 syswow64
          # Move x64 DLLs to system32
          find . -path "*/x64/*.dll" -exec cp {} system32/ \;
          find . -path "*/x64/*.dll.a" -exec cp {} system32/ \;
          # Move x32 DLLs to syswow64
          find . -path "*/x32/*.dll" -exec cp {} syswow64/ \;
          find . -path "*/x32/*.dll.a" -exec cp {} syswow64/ \;

      - name: Read version from RELEASE file
        id: version
        run: |
          VERSION=$(cat RELEASE)
          echo "release=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Using version: $VERSION"

      - name: Package WCP (DXVK type)
        run: |
          cd workdir
          VERSION="${{ steps.version.outputs.release }}"
          cat > profile.json << JSONEOF
          {
            "type": "DXVK",
            "versionName": "${VERSION}-vegas",
            "versionCode": 1,
            "description": "VEGAS — Community DXVK fork optimized for Android/Winlator",
            "files": [
              {"source": "system32/d3d9.dll",      "target": "${system32}/d3d9.dll"},
              {"source": "system32/d3d10core.dll", "target": "${system32}/d3d10core.dll"},
              {"source": "system32/d3d11.dll",     "target": "${system32}/d3d11.dll"},
              {"source": "system32/dxgi.dll",      "target": "${system32}/dxgi.dll"},
              {"source": "syswow64/d3d8.dll",      "target": "${syswow64}/d3d8.dll"},
              {"source": "syswow64/d3d9.dll",      "target": "${syswow64}/d3d9.dll"},
              {"source": "syswow64/d3d10core.dll", "target": "${syswow64}/d3d10core.dll"},
              {"source": "syswow64/d3d11.dll",     "target": "${syswow64}/d3d11.dll"},
              {"source": "syswow64/dxgi.dll",      "target": "${syswow64}/dxgi.dll"}
            ]
          }
          JSONEOF
          tar --zstd -cf "../dxvk-${VERSION}-vegas-${{ needs.setup.outputs.tag }}.wcp" \
            system32/ syswow64/ profile.json

      - name: Package WCP (VEGAS type)
        run: |
          cd workdir
          VERSION="${{ steps.version.outputs.release }}"
          cat > profile.json << JSONEOF
          {
            "type": "VEGAS",
            "versionName": "vegas-${VERSION}",
            "versionCode": 1,
            "description": "VEGAS — community DXVK fork optimized for Adreno GPUs",
            "files": [
              {"source": "system32/d3d9.dll",      "target": "${system32}/d3d9.dll"},
              {"source": "system32/d3d10core.dll", "target": "${system32}/d3d10core.dll"},
              {"source": "system32/d3d11.dll",     "target": "${system32}/d3d11.dll"},
              {"source": "system32/dxgi.dll",      "target": "${system32}/dxgi.dll"},
              {"source": "syswow64/d3d8.dll",      "target": "${syswow64}/d3d8.dll"},
              {"source": "syswow64/d3d9.dll",      "target": "${syswow64}/d3d9.dll"},
              {"source": "syswow64/d3d10core.dll", "target": "${syswow64}/d3d10core.dll"},
              {"source": "syswow64/d3d11.dll",     "target": "${syswow64}/d3d11.dll"},
              {"source": "syswow64/dxgi.dll",      "target": "${syswow64}/dxgi.dll"}
            ]
          }
          JSONEOF
          tar --zstd -cf "../vegas-${VERSION}-${{ needs.setup.outputs.tag }}.wcp" \
            system32/ syswow64/ profile.json

      - name: Upload WCP to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.setup.outputs.tag }}"
          gh release upload "$TAG" ./*.wcp --clobber
          # Publish the release
          gh release edit "$TAG" --draft=false

      - name: Upload vegas config to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.setup.outputs.tag }}"
          if [ -d vegas ]; then
            tar czf vegas-config.tar.gz vegas/
            gh release upload "$TAG" vegas-config.tar.gz --clobber
          fi

      - name: Trigger WCP Build workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run wcpbuild.yml --ref ${{ github.ref_name }} \
            -f release_tag="${{ needs.setup.outputs.tag }}"

