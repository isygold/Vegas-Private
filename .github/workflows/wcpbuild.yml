name: WCP Build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag of the Release containing built DLLs"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-wcp:
    name: Build WCP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install zstd
        run: sudo apt-get update -y && sudo apt-get install -y zstd

      - name: Download from Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.release_tag }}"
          mkdir -p workdir
          cd workdir
          # Unpack all assets from the release
          gh release download "$TAG"
          # Also clone vegas config
          git clone --depth 1 https://github.com/isygold/Vegas-Private.git /tmp/vegas-repo 2>/dev/null || true

      - name: Restructure for WCP
        run: |
          cd workdir
          # Find all DLLs and sort them
          mkdir -p system32 syswow64
          # x64 DLLs (from x64/ subdirectories)
          find . -path "*/x64/*.dll" -exec cp {} system32/ \; 2>/dev/null || true
          # x32 DLLs (from x32/ subdirectories)
          find . -path "*/x32/*.dll" -exec cp {} syswow64/ \; 2>/dev/null || true
          # Also check for DLLs directly in release (if uploaded flat)
          find . -maxdepth 1 -name "*.dll" -exec sh -c "basename {} | grep -q x32|\" && cp {} syswow64/ || cp {} system32/" \; 2>/dev/null || true

      - name: Package WCP (DXVK type)
        run: |
          cd workdir
          VERSION="${{ inputs.release_tag }}"
          cat > profile.json << JSONEOF
          {
            "type": "DXVK",
            "versionName": "${VERSION}",
            "versionCode": 1,
            "description": "VEGAS — Community DXVK fork optimized for Android/Winlator",
            "files": [
              {"source": "system32/d3d9.dll",      "target": "${system32}/d3d9.dll"},
              {"source": "system32/d3d10core.dll", "target": "${system32}/d3d10core.dll"},
              {"source": "system32/d3d11.dll",     "target": "${system32}/d3d11.dll"},
              {"source": "system32/dxgi.dll",      "target": "${system32}/dxgi.dll"},
              {"source": "syswow64/d3d8.dll",      "target": "${syswow64}/d3d8.dll"},
              {"source": "syswow64/d3d9.dll",      "target": "${syswow64}/d3d9.dll"},
              {"source": "syswow64/d3d10core.dll", "target": "${syswow64}/d3d10core.dll"},
              {"source": "syswow64/d3d11.dll",     "target": "${syswow64}/d3d11.dll"},
              {"source": "syswow64/dxgi.dll",      "target": "${syswow64}/dxgi.dll"}
            ]
          }
          JSONEOF
          tar --zstd -cf "../dxvk-${VERSION}.wcp" \
            system32/ syswow64/ profile.json

      - name: Package WCP (VEGAS type)
        run: |
          cd workdir
          VERSION="${{ inputs.release_tag }}"
          cat > profile.json << JSONEOF
          {
            "type": "VEGAS",
            "versionName": "vegas-${VERSION}",
            "versionCode": 1,
            "description": "VEGAS — community DXVK fork optimized for Adreno GPUs",
            "files": [
              {"source": "system32/d3d9.dll",      "target": "${system32}/d3d9.dll"},
              {"source": "system32/d3d10core.dll", "target": "${system32}/d3d10core.dll"},
              {"source": "system32/d3d11.dll",     "target": "${system32}/d3d11.dll"},
              {"source": "system32/dxgi.dll",      "target": "${system32}/dxgi.dll"},
              {"source": "syswow64/d3d8.dll",      "target": "${syswow64}/d3d8.dll"},
              {"source": "syswow64/d3d9.dll",      "target": "${syswow64}/d3d9.dll"},
              {"source": "syswow64/d3d10core.dll", "target": "${syswow64}/d3d10core.dll"},
              {"source": "syswow64/d3d11.dll",     "target": "${syswow64}/d3d11.dll"},
              {"source": "syswow64/dxgi.dll",      "target": "${syswow64}/dxgi.dll"}
            ]
          }
          JSONEOF
          tar --zstd -cf "../vegas-${VERSION}.wcp" \
            system32/ syswow64/ profile.json

      - name: Upload WCPs to current Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.release_tag }}"
          gh release upload "$TAG" ./*.wcp --clobber

      - name: Upload WCPs to vegas-releases (if configured)
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
        run: |
          if [ -n "${{ secrets.PAT_TOKEN }}" ] || [ "${{ github.token }}" != "" ]; then
            # Clone vegas-releases
            git clone --depth 1 https://x-access-token:${GH_TOKEN}@github.com/isygold/vegas-releases.git /tmp/vegas-releases 2>/dev/null || true
            mkdir -p /tmp/vegas-releases/wcp
            cp ./*.wcp /tmp/vegas-releases/wcp/ 2>/dev/null || true
            cd /tmp/vegas-releases
            git add wcp/
            git diff --cached --quiet || (git -c user.name="GitHub Actions" -c user.email="actions@github.com" commit -m "Add WCP packages for ${{ inputs.release_tag }}" && git push)
          fi

